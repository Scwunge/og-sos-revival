# SOS: Classic community server settings. Lines are key=value; # starts a comment.

# Name shown in the server list (3 to 48 characters). Do not imitate official servers.
Name=My SOS Server

# Region label shown in the list, e.g. EU, NA, SA, AS, OC.
Region=EU

# 2 to 16.
MaxPlayers=16

# UDP port the game listens on. Forward this UDP port on your router to this PC.
Port=7777

# Lobby backend, host:port.
Backend=sos.joltora.com:7781

# Optional: full path of your "SOS Test Server" folder. Leave empty to auto-detect from Steam.
GameFolder=

# Optional: community key from the backend admin (makes your server verified).
CommunityKey=

# 1 = show the game window (normally hidden).
ShowWindow=0
