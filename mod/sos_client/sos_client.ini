; sos_client.ini - goes next to xinput1_3.dll in SOS\Binaries\Win64 (SOS: Classic).
; All keys are optional; the values below are the defaults.
[Client]
; Community backend the game talks to, host:port (a DNS name is fine).
; The in-game server list also writes this key when you pick a server that
; lives on another backend (restart the game to switch).
Backend=sos.joltora.com:7781
; 1 = answer the game's Outpost* endpoint config reads with the backend above
; (no Engine.ini edits needed). 0 = leave the game's config alone.
OverrideEndpoints=1
; 1 = draw the SERVERS button and server list overlay. 0 = off.
Overlay=1
; Testing: 1 = show the SERVERS button on every map, not only the main menu.
ShowButtonEverywhere=0
; Log file, relative to this folder or absolute. "-" disables the file.
LogFile=sos_client.log
; 1 = copy every UE_LOG line to sos_client_game_<pid>.log here (grows fast).
GameLog=0
; 1 = after you pick a server in the list, queue for a match for you (the same
; as pressing PLAY). 0 = only select the server; press PLAY yourself.
AutoPlay=1
; 1 = show the unreleased Ronin outfit parts (CA_MaleRonin_*, MaleWanderer, group
; "Ronin") and the unreleased CA_MaleCynic_FacialHair_A in character customisation.
; Only those assets are allowed; paid or role-locked items stay locked.
UnlockUnreleasedCosmetics=1
