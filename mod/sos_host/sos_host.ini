; sos_host.ini - goes next to version.dll in SOS\Binaries\Win64.
; All keys are optional; the values below are the defaults.
[Host]
; 1 = give the game a working UWorld::Listen (hosting). 0 = stock behaviour.
EnableListen=1
; Listen port. 0 = use the URL port (7777 unless -Port= or :port is given).
Port=0
; 1 = disable the shipping command-line allow-list so -log, -Port= etc. work.
UnfilterCommandLine=1
; 0 = when the game picks SteamNetDriver, listen on plain IP sockets
; (what ?bIsLanMatch does), so clients can join by IP:port. 1 = Steam sockets.
SteamSockets=0
; Main client only: seconds before a player stuck in LoginPending is sent to
; the main menu (blackbird.LoginPendingTimeout, game default 120). The host
; player skips the Frontend login when booting straight into a map, so raise
; this on a host. 0 = leave the game default.
LoginPendingTimeout=0
; Log file, relative to this folder or absolute. "-" disables the file.
LogFile=sos_host.log
; 1 = copy every UE_LOG line the game emits to sos_game_<pid>.log in this
; folder (the shipping client writes no SOS.log). Files grow fast (tens of
; MB per hour of play). 0 = off.
GameLog=1
; Main client only. 1 = after the host sends ClientRetryClientRestart to a
; joiner whose controller is Playing with a pawn, also send
; ClientGotoState(Playing), so the joiner leaves its loading screen at once
; instead of after several minutes in LoginPending.
FixJoinState=1
; Main client only, test switch. 1 = ignore UTeamManager::EliminatePlayer
; (players who never "joined the match" through an MMS session get
; eliminated). Logged either way.
BlockEliminate=0
; Bytes per second each joiner may receive. The client asks for its own
; ConfiguredInternetSpeed (100000) and the host clamps it to MaxClientRate
; (50000 in this build), which slows the first replication of a big map.
; >0 sets UNetDriver MaxClientRate and MaxInternetClientRate after Listen.
; 0 = leave the game value.
MaxClientRate=100000
; SOS: Classic only. 1 = run sos_host's own actor replication pass before each
; UNetDriver::TickFlush. The shipping client is built without the server
; replication loop, so without this a joiner only receives actors that an RPC
; targets (its controller, the GameState) and never its own pawn.
ReplicateActors=1
; 1 = also replicate actors placed in the map (bNetStartup). Off by default:
; there are tens of thousands and the client has them loaded already.
ReplicateStartupActors=0
; 2 = only map actors within StartupActorRadius cm of each joiner (crates, breakables)
StartupActorRadius=15000
; SOS: Classic only. 1 = answer every joiner move (ServerMove) with
; ClientAckGoodMove. The shipping client has no SendClientAdjustment, so
; without this a joiner stops moving after 96 unacknowledged moves. Joiners are
; trusted with their own position (see CorrectMoves).
AckMoves=1
; 1 = when the host has a joiner more than CorrectDistance cm from where the
; joiner says it is (a teleport, the match start), move the joiner to the
; host's position. While falling only a gap of 10 m or more is corrected.
; 0 = never correct.
CorrectMoves=1
CorrectDistance=300
; Lobby backend, for the match-end event (POST <BackendUrl>/session/<id>/events).
; Include /api, e.g. http://backend:7781/api. Env SOS_HOST_BACKEND,
; SOS_HOST_SESSION and SOS_HOST_TOKEN override; the session id and token also
; come from -SESSION_ID= and -SESSION_TOKEN= on the command line.
BackendUrl=
SessionId=
SessionToken=
; SOS: Classic only, test switch. 1 = the host's RestartPlayer treats every
; player as logged in to the backend. Players who skipped the frontend login
; (a joiner started with a direct 127.0.0.1:7777 URL, the host's own player)
; then spawn instead of waiting in LoginPending forever. Joiners who came in
; through the launcher and PLAY are logged in already and do not need it.
SkipLoginCheck=0
; SOS: Classic only. Characters (joiner pawns, AI) within this many cm of a
; joiner always tick their animation pose on the host. A listen host otherwise
; ticks a pose only while it renders it, so off-screen montages never advance:
; no AnimNotifies (eating, melee hits) and no root motion. 0 = off.
TickCharacterRadius=15000
; >0 = cap the host at this many frames per second (sleeps each frame once
; hosting). Lowers host CPU; 30 matches a dedicated server's tick rate.
; 0 = no cap. Env SOS_HOST_MAX_FPS overrides.
MaxFPS=0
; SOS: Classic only. Bytes per second each joiner may receive. A client asks
; for 100000 and is clamped to MaxClientRate; over the internet that saturates
; for a minute after joining (nearby map actors), and the joiner's own pawn
; sits in the void meanwhile. >0 overrides each joiner connection's rate.
; 0 = leave the engine value.
JoinerNetSpeed=400000
; 1 = send the host's streaming-level states to each joiner (intro and
; end-of-match sublevels). Off: in the render-PC playtest it kept both
; joiners on the loading screen.
MirrorStreamingLevels=0
; 1 = set each joiner pawn's Owner to its controller (the host leaves it
; null; the joiner then draws its own body around its first-person camera).
SetPawnOwner=1
; SOS: Classic only. Comma-separated ShooterPlayerState property names (for
; example Kills,Damage) copied into each player's entry of the match-end event
; JSON, read from the live PlayerState. Empty = none.
StatProps=
; Test switch. >0 = after this many seconds of play (counted from the first
; tracked player) behave as if the match ended and post the results event.
TestMatchEndSec=0
